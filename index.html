<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preparada? 💖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #FFE3EC;
    --rose: #F7B6CB;
    --ink: #3A0F2E;
    --ink-soft: #7A4A68;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--blush);
    color: var(--ink);
    height: 100svh;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .tela {
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
  }
  h1 {
    font-size: clamp(3.5rem, 15vw, 11rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 0.9;
  }
  .actions {
    margin-top: clamp(2rem, 6vh, 3.5rem);
    display: flex;
    gap: 1rem;
    justify-content: center;
    align-items: center;
  }
  button {
    font: 600 1.25rem/1 "Inter", system-ui, sans-serif;
    padding: 1rem 2.4rem;
    border-radius: 999px;
    border: 2px solid var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ink-soft); outline-offset: 4px; }
  .coracao { font-size: .7em; letter-spacing: 0; display: inline-block; vertical-align: .08em; }
  #sim { background: var(--ink); color: var(--blush); }
  #sim:hover { transform: scale(1.04); }
  #nao { background: transparent; color: var(--ink); }
  #nao.solto {
    position: fixed;
    z-index: 10;
    transition: left .28s cubic-bezier(.2,.8,.2,1), top .28s cubic-bezier(.2,.8,.2,1);
  }

  /* ---------- Depois do "Sim" ---------- */
  #final { display: none; }
  body.aceito { height: auto; overflow-y: auto; background: var(--rose); transition: background .6s; }
  body.aceito #pergunta { display: none; }
  body.aceito #final { display: block; }
  body.aceito .boas-vindas h1 { animation: surge .7s cubic-bezier(.2,.8,.2,1); }

  .boas-vindas { position: relative; }
  .role {
    position: absolute;
    left: 50%;
    bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .5rem;
  }
  .role svg { animation: quica 1.6s ease-in-out infinite; }

  .video {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 3rem 1.25rem calc(3rem + env(safe-area-inset-bottom, 0px));
    background: var(--blush);
  }
  .moldura {
    /* Proporção do vídeo: troque para 9 / 16 se ele foi gravado em pé */
    --proporcao: 16 / 9;
    width: min(100%, 960px, calc(85svh * (var(--proporcao))));
    aspect-ratio: var(--proporcao);
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid var(--ink);
    background: var(--ink);
  }
  .moldura iframe { width: 100%; height: 100%; border: 0; display: block; }

  @keyframes surge { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes quica { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    #nao.solto { transition: none; }
    body.aceito .boas-vindas h1, .role svg { animation: none; }
  }
</style>
</head>
<body>
<main id="pergunta" class="tela">
  <section>
    <h1>Preparada? <span class="coracao" aria-hidden="true">💖</span></h1>
    <div class="actions">
      <button id="sim" type="button">Sim</button>
      <button id="nao" type="button">Não</button>
    </div>
  </section>
</main>

<div id="final">
  <section class="tela boas-vindas" aria-live="polite">
    <h1>Bem-vinda,<br>Lol</h1>
    <a class="role" href="#video">
      Role para baixo
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </a>
  </section>

  <section id="video" class="video">
    <div class="moldura">
      <iframe id="player" title="Vídeo" allow="autoplay; fullscreen" allowfullscreen
        data-src="https://drive.google.com/file/d/1NtvqhmDN0xrq9fLYgjuFe6DHwwy0HvaR/preview"></iframe>
    </div>
  </section>
</div>

<script>
(() => {
  const nao = document.getElementById('nao');
  const sim = document.getElementById('sim');
  const player = document.getElementById('player');
  const MARGEM = 16;
  const ALCANCE = 90;
  const frases = ['Não', 'Tem certeza?', 'Pensa bem', 'Não adianta', 'Desiste', 'Sério?'];
  let tentativas = 0;

  const sobrepoe = (a, b, folga = 24) =>
    !(a.right + folga < b.left || a.left - folga > b.right ||
      a.bottom + folga < b.top || a.top - folga > b.bottom);

  function fugir(px, py) {
    tentativas++;
    nao.textContent = frases[Math.min(tentativas, frases.length - 1)];

    if (!nao.classList.contains('solto')) {
      const r = nao.getBoundingClientRect();
      nao.style.left = r.left + 'px';
      nao.style.top = r.top + 'px';
      nao.classList.add('solto');
      void nao.offsetWidth;
    }

    const w = nao.offsetWidth, h = nao.offsetHeight;
    const maxX = window.innerWidth - w - MARGEM;
    const maxY = window.innerHeight - h - MARGEM;
    const rSim = sim.getBoundingClientRect();

    let x, y, ok = false;
    for (let i = 0; i < 40 && !ok; i++) {
      x = MARGEM + Math.random() * Math.max(0, maxX - MARGEM);
      y = MARGEM + Math.random() * Math.max(0, maxY - MARGEM);
      const alvo = { left: x, top: y, right: x + w, bottom: y + h };
      const longe = px == null || Math.hypot(x + w / 2 - px, y + h / 2 - py) > ALCANCE * 2;
      ok = longe && !sobrepoe(alvo, rSim);
    }
    nao.style.left = x + 'px';
    nao.style.top = y + 'px';
  }

  function aoMover(e) {
    if (e.pointerType !== 'mouse') return;
    const r = nao.getBoundingClientRect();
    const d = Math.hypot(r.left + r.width / 2 - e.clientX, r.top + r.height / 2 - e.clientY);
    if (d < ALCANCE + r.width / 2) fugir(e.clientX, e.clientY);
  }
  document.addEventListener('pointermove', aoMover);

  nao.addEventListener('pointerdown', e => { e.preventDefault(); fugir(e.clientX, e.clientY); });
  nao.addEventListener('touchstart', e => { e.preventDefault(); fugir(); }, { passive: false });
  nao.addEventListener('click', e => { e.preventDefault(); fugir(); });
  nao.addEventListener('focus', () => { nao.blur(); sim.focus(); fugir(); });

  window.addEventListener('resize', () => {
    if (!nao.isConnected || !nao.classList.contains('solto')) return;
    const maxX = window.innerWidth - nao.offsetWidth - MARGEM;
    const maxY = window.innerHeight - nao.offsetHeight - MARGEM;
    nao.style.left = Math.min(parseFloat(nao.style.left), maxX) + 'px';
    nao.style.top = Math.min(parseFloat(nao.style.top), maxY) + 'px';
  });

  sim.addEventListener('click', () => {
    document.removeEventListener('pointermove', aoMover);
    nao.remove();
    // O player do Drive começa a carregar já no "Sim", para estar pronto quando ela rolar
    player.src = player.dataset.src;
    document.body.classList.add('aceito');
    window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
